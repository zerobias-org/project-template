id: 37843720-39ba-45a4-b56f-7a28a5eee853
name: Spec Kit project
description: Spec-driven development with GitHub Spec Kit. One constitution for the project, then a spec, a plan and tasks for each feature.
keywords: [spec-kit, spec-driven, sdd, specification, ai-agent]
projectType: standard
lifecycle: evergreen
skill:
  name: spec-kit-project
  description: Run GitHub Spec Kit in a ZeroBias project — constitution, specs, plans, tasks and convergence.
  url: https://github.com/zerobias-org/project-template/blob/main/package/zerobias/spec_kit/files/skills/spec-kit-project/SKILL.md
  install: Copy Documents/Skills/spec-kit-project-SKILL.md to .claude/skills/spec-kit-project/SKILL.md
boards:
  - key: constitution
    name: Constitution
    activities: [pmDecision, pmQuestion, task]
  - key: specs
    name: Specs
    isDefault: true
    activities: [pmSpec, pmStory, pmQuestion, pmDecision]
  - key: plans
    name: Plans
    activities: [pmResearch, pmDecision, pmQuestion, task]
  - key: tasks
    name: Tasks
    activities: [task, pmRelease]
notes:
  notebooks:
    - name: Clarifications
    - name: Meeting notes
    - name: Status updates
documents:
  folders: [Constitution, Specs, Templates, Archive, Skills]
  files:
    - folder: ''
      name: OPERATING.md
      source: files/OPERATING.md
    - folder: Constitution
      name: constitution.md
      source: files/templates/constitution-template.md
    - folder: Templates
      name: spec-template.md
      source: files/templates/spec-template.md
    - folder: Templates
      name: plan-template.md
      source: files/templates/plan-template.md
    - folder: Templates
      name: tasks-template.md
      source: files/templates/tasks-template.md
    - folder: Templates
      name: checklist-template.md
      source: files/templates/checklist-template.md
    - folder: Templates
      name: constitution-template.md
      source: files/templates/constitution-template.md
    - folder: Templates
      name: LICENSE-spec-kit.txt
      source: files/templates/LICENSE-spec-kit.txt
    - folder: Skills
      name: spec-kit-project-SKILL.md
      source: files/skills/spec-kit-project/SKILL.md
tasks:
  - board: constitution
    name: 'Constitution: ${projectName}'
    activity: task
    description: Write the project constitution in Documents/Constitution/constitution.md. Replace every [PLACEHOLDER] with the project's principles and governance.
  - board: specs
    name: 'Spec: first feature'
    activity: pmSpec
    description: Specify the first feature. Make Documents/Specs/001-<feature>/spec.md from Templates/spec-template.md. Describe what and why, not how.
