# Starter project template. scripts/new-template.sh copies this file into a package.
# Replace every REPLACE-... value. Delete optional fields you do not need.
# Field reference: README.md. Checklist: AGENTS.md.

id: REPLACE-WITH-NEW-UUID                # required. New lowercase UUID: uuidgen | tr A-Z a-z. Never reuse or change it
name: REPLACE-WITH-TEMPLATE-NAME         # required. Name the user sees in the Create Project dialog
description: REPLACE-WITH-DESCRIPTION    # required. What a project made from this template is for
# imageUrl: https://...                  # optional. Image for the template. Delete the # and set a real URL; left out, the default icon is used
keywords: [example, starter]             # optional. Search terms

projectType: REPLACE-WITH-PROJECT-TYPE   # required. standard | program | coordination_program | product_management | portfolio | phase | assessment | engagement | rfp | pilot
lifecycle: REPLACE-WITH-LIFECYCLE        # required. fixed-term | evergreen. Must be a valid pair with projectType (README.md)

# skill:                                 # optional. The agent skill that operates projects made from this template
#   name: REPLACE-SKILL-NAME             # the name in files/skills/<name>/SKILL.md front matter
#   description: REPLACE-WITH-ONE-LINE   # what the skill does
#   url: https://github.com/zerobias-org/project-template/blob/main/package/REPLACE-VENDOR/REPLACE-NAME/files/skills/REPLACE-SKILL-NAME/SKILL.md
#   install: Copy Documents/Skills/REPLACE-SKILL-NAME-SKILL.md to .claude/skills/REPLACE-SKILL-NAME/SKILL.md

boards:                                  # required. At least one board
  - key: main                            # required. Local key, unique in this file. Tasks name it in `board`
    name: Main                           # required. Board name
    isDefault: true                      # exactly one board. The project's default board gets this name
    activities: [task]                   # required. Activity codes the board allows. Codes, never ids
  - key: decisions
    name: Decisions & Questions
    activities: [pmQuestion, pmDecision, task]   # pm* codes: the Product Management activities, on every environment

notes:                                   # optional
  notebooks:                             # Notes notebooks. Names only in v1
    - name: Meeting notes
    - name: Status updates

documents:                               # optional
  folders: [Specs, Reviews, Archive]     # Documents folder names
  files:                                 # starter files the project gets, copied from the catalog
    - name: OPERATING.md                 # file name in the project. No folder: the Documents root
      path: files/OPERATING.md           # path in this package; zerobias.catalog-files in package.json must match it
#   - folder: Skills                     # a name from folders. With skill: add Skills to folders, put the skill here
#     name: REPLACE-SKILL-NAME-SKILL.md
#     path: files/skills/REPLACE-SKILL-NAME/SKILL.md

tasks:                                   # optional. Starter tasks
  - board: main                          # required. A board key from above
    name: 'Kickoff: ${projectName}'      # required. Placeholders: ${projectName}, ${projectId}. Quote the value
    activity: task                       # required. One of the activities of its board
    description: Agree the scope and the first milestones.   # optional
